name: KAI Pre-Refresh Backup Snapshot
on:
  push:
    branches:
      - backup/pre-visual-refresh-20260930

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact pre-refresh main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          lfs: true

      - name: Create and split source snapshot
        run: |
          NAME="books-pre-visual-refresh-20260930"
          zip -r "$NAME.zip" . -x ".git/*" -x "$NAME.zip" -x "$NAME.zip.part-*"
          split -b 60M "$NAME.zip" "$NAME.zip.part-"
          ls -lh "$NAME.zip.part-"*

      - name: Upload backup part aa
        uses: actions/upload-artifact@v4
        with:
          name: books-pre-visual-refresh-20260930-part-aa
          path: books-pre-visual-refresh-20260930.zip.part-aa
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload backup part ab
        uses: actions/upload-artifact@v4
        with:
          name: books-pre-visual-refresh-20260930-part-ab
          path: books-pre-visual-refresh-20260930.zip.part-ab
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload backup part ac
        uses: actions/upload-artifact@v4
        with:
          name: books-pre-visual-refresh-20260930-part-ac
          path: books-pre-visual-refresh-20260930.zip.part-ac
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload backup part ad
        uses: actions/upload-artifact@v4
        with:
          name: books-pre-visual-refresh-20260930-part-ad
          path: books-pre-visual-refresh-20260930.zip.part-ad
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload backup part ae
        uses: actions/upload-artifact@v4
        with:
          name: books-pre-visual-refresh-20260930-part-ae
          path: books-pre-visual-refresh-20260930.zip.part-ae
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload backup part af
        uses: actions/upload-artifact@v4
        with:
          name: books-pre-visual-refresh-20260930-part-af
          path: books-pre-visual-refresh-20260930.zip.part-af
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload backup part ag
        uses: actions/upload-artifact@v4
        with:
          name: books-pre-visual-refresh-20260930-part-ag
          path: books-pre-visual-refresh-20260930.zip.part-ag
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload backup part ah
        uses: actions/upload-artifact@v4
        with:
          name: books-pre-visual-refresh-20260930-part-ah
          path: books-pre-visual-refresh-20260930.zip.part-ah
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload backup part ai
        uses: actions/upload-artifact@v4
        with:
          name: books-pre-visual-refresh-20260930-part-ai
          path: books-pre-visual-refresh-20260930.zip.part-ai
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload backup part aj
        uses: actions/upload-artifact@v4
        with:
          name: books-pre-visual-refresh-20260930-part-aj
          path: books-pre-visual-refresh-20260930.zip.part-aj
          if-no-files-found: ignore
          retention-days: 30
